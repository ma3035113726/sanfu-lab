<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANFU LAB - 我的衣橱</title>
    <link rel="stylesheet" href="../css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }
        .navbar .logo {
            color: #a855f7;
            font-weight: 700;
        }
        .navbar .nav-links a {
            color: #333;
        }
        .navbar .nav-links a.active {
            color: #a855f7;
        }
        .navbar .search-box {
            background: rgba(0, 0, 0, 0.05);
        }
        .navbar .search-input {
            color: #333;
        }
        .navbar .search-input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }
        .navbar .user-avatar {
            background: linear-gradient(135deg, #a855f7, #ec4899);
        }
        .my-closet {
            min-height: 100vh;
            padding-top: 120px;
            padding-bottom: 60px;
            background: #f8f9fa;
        }
        .closet-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }
        .closet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .closet-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .closet-actions {
            display: flex;
            gap: 12px;
        }
        .closet-action-btn {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .closet-action-btn.primary {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
        }
        .closet-action-btn.secondary {
            background: rgba(0, 0, 0, 0.05);
            color: #333;
        }
        .closet-categories {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .category-tab {
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border-color: transparent;
        }
        .closet-grid {
            display: grid !important;
            grid-template-columns: repeat(6, 1fr) !important;
            gap: 20px !important;
            margin-bottom: 30px;
        }
        .closet-item {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .closet-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .closet-item-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .closet-item-info {
            padding: 12px;
        }
        .closet-item-name {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
        .closet-item-category {
            font-size: 12px;
            color: #999;
        }
        .outfit-preview {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .outfit-preview-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-right: 16px;
        }
        .outfit-preview-items {
            display: flex;
            gap: 12px;
            flex: 1;
        }
        .preview-item {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">SANFU LAB</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="ai-outfit.html">AI穿搭</a></li>
                <li><a href="community.html">潮流社区</a></li>
                <li><a href="lab.html">穿搭实验室</a></li>
                <li><a href="stores.html">品牌故事</a></li>
                <li><a href="member.html">会员中心</a></li>
                <li><a href="closet.html">我的衣橱</a></li>
            </ul>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="搜索穿搭风格..." id="searchInput">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="user-avatar" onclick="location.href='login.html'">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <section class="my-closet">
        <div class="closet-container">
            <div class="closet-header">
                <h1 class="closet-title">我的衣橱</h1>
            </div>

            <div class="closet-categories">
                <button class="category-tab active" data-category="全部">全部</button>
                <button class="category-tab" data-category="上衣">上衣</button>
                <button class="category-tab" data-category="裤子">裤子</button>
                <button class="category-tab" data-category="外套">外套</button>
                <button class="category-tab" data-category="配饰">配饰</button>
                <button class="category-tab" data-category="鞋子">鞋子</button>
            </div>

            <div class="closet-grid" id="closetGrid">
                <div class="closet-item" draggable="true" data-category="上衣">
                    <img src="../images/closet/closet1.jpg" alt="白色T恤" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">白色宽松T恤</div>
                        <div class="closet-item-category">上衣</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="裤子">
                    <img src="../images/closet/closet2.jpg" alt="高腰牛仔裤" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">高腰牛仔裤</div>
                        <div class="closet-item-category">裤子</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="外套">
                    <img src="../images/closet/closet3.jpg" alt="银色外套" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">银色金属外套</div>
                        <div class="closet-item-category">外套</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="配饰">
                    <img src="../images/closet/closet4.jpg" alt="银色项链" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">银色链条项链</div>
                        <div class="closet-item-category">配饰</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="鞋子">
                    <img src="../images/closet/closet5.jpg" alt="白色运动鞋" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">白色运动鞋</div>
                        <div class="closet-item-category">鞋子</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="上衣">
                    <img src="../images/closet/closet6.jpg" alt="粉色短上衣" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">粉色短上衣</div>
                        <div class="closet-item-category">上衣</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="裤子">
                    <img src="../images/closet/closet7.jpg" alt="黑色皮裤" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">黑色皮裤</div>
                        <div class="closet-item-category">裤子</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="外套">
                    <img src="../images/closet/closet8.jpg" alt="米色西装" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">米色oversize西装</div>
                        <div class="closet-item-category">外套</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="配饰">
                    <img src="../images/closet/closet9.jpg" alt="蝴蝶发夹" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">蝴蝶发夹套装</div>
                        <div class="closet-item-category">配饰</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="鞋子">
                    <img src="../images/closet/closet10.jpg" alt="黑色厚底靴" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">黑色厚底靴</div>
                        <div class="closet-item-category">鞋子</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="上衣">
                    <img src="../images/closet/closet11.jpg" alt="乐队T恤" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">乐队印花T恤</div>
                        <div class="closet-item-category">上衣</div>
                    </div>
                </div>
                <div class="closet-item" draggable="true" data-category="裤子">
                    <img src="../images/closet/closet12.jpg" alt="牛仔短裤" class="closet-item-image">
                    <div class="closet-item-info">
                        <div class="closet-item-name">高腰牛仔短裤</div>
                        <div class="closet-item-category">裤子</div>
                    </div>
                </div>
            </div>

            <div class="outfit-preview" id="outfitPreview">
                <span class="outfit-preview-title">搭配预览</span>
                <div class="outfit-preview-items" id="previewItems">
                    <div class="preview-item empty">
                        <i class="fas fa-plus" style="color: var(--text-light); font-size: 24px;"></i>
                    </div>
                    <div class="preview-item empty">
                        <i class="fas fa-plus" style="color: var(--text-light); font-size: 24px;"></i>
                    </div>
                    <div class="preview-item empty">
                        <i class="fas fa-plus" style="color: var(--text-light); font-size: 24px;"></i>
                    </div>
                </div>
                <button class="closet-action-btn primary" style="margin-left: 16px;">生成搭配</button>
            </div>
        </div>
    </section>

    

    <script>
        const navbar = document.getElementById('navbar');
        const searchInput = document.getElementById('searchInput');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        searchInput.addEventListener('focus', () => {
            location.href = 'search.html';
        });

        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const category = this.dataset.category;
                const items = document.querySelectorAll('.closet-item');
                
                items.forEach(item => {
                    if (category === '全部') {
                        item.style.display = 'block';
                    } else {
                        if (item.dataset.category === category) {
                            item.style.display = 'block';
                        } else {
                            item.style.display = 'none';
                        }
                    }
                });
            });
        });

        document.querySelectorAll('.closet-item').forEach(item => {
            item.addEventListener('dragstart', function(e) {
                e.dataTransfer.setData('text/plain', this.querySelector('.closet-item-name').textContent);
                this.classList.add('selected');
            });
            
            item.addEventListener('dragend', function() {
                this.classList.remove('selected');
            });

            item.addEventListener('click', function() {
                showItemDetail(this);
            });
        });

        const previewItems = document.querySelectorAll('.preview-item');
        previewItems.forEach(item => {
            item.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#A855F7';
            });
            
            item.addEventListener('dragleave', function() {
                this.style.borderColor = 'var(--silver-gray)';
            });
            
            item.addEventListener('drop', function(e) {
                e.preventDefault();
                const itemName = e.dataTransfer.getData('text/plain');
                this.innerHTML = `<div style="color: var(--text-primary); font-size: 10px; text-align: center; padding: 8px;">${itemName}</div>`;
                this.classList.remove('empty');
                this.style.borderColor = '#A855F7';
            });
        });

        function showItemDetail(item) {
            const modal = document.createElement('div');
            modal.className = 'item-detail-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close-modal">&times;</span>
                    <div class="modal-image">
                        <img src="${item.querySelector('img').src}" alt="商品图片">
                    </div>
                    <div class="modal-info">
                        <h3>${item.querySelector('.closet-item-name').textContent}</h3>
                        <p>分类�?{item.querySelector('.closet-item-category').textContent}</p>
                        <div class="modal-section">
                            <h4>搭配推荐</h4>
                            <div class="recommendation-tags">
                                <span>高腰牛仔�?/span>
                                <span>白色运动�?/span>
                                <span>银色项链</span>
                            </div>
                        </div>
                        <div class="modal-section">
                            <h4>适合场景</h4>
                            <span>日常、逛街、约�?/span>
                        </div>
                        <div class="modal-section">
                            <h4>搭配评分</h4>
                            <div class="score-display">92�?/div>
                        </div>
                        <button class="action-btn primary">查看相似单品</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            modal.querySelector('.close-modal').addEventListener('click', () => {
                document.body.removeChild(modal);
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
        }

        const style = document.createElement('style');
        style.textContent = `
            .item-detail-modal {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .modal-content {
                background: white;
                border-radius: 24px;
                padding: 32px;
                max-width: 800px;
                width: 90%;
                max-height: 90vh;
                overflow-y: auto;
                position: relative;
            }
            .close-modal {
                position: absolute;
                top: 20px;
                right: 20px;
                font-size: 28px;
                cursor: pointer;
                color: var(--text-secondary);
            }
            .modal-image img {
                width: 100%;
                height: 300px;
                object-fit: cover;
                border-radius: 16px;
                margin-bottom: 24px;
            }
            .modal-info h3 {
                font-size: 24px;
                font-weight: 700;
                margin-bottom: 8px;
            }
            .modal-info p {
                color: var(--text-secondary);
                margin-bottom: 20px;
            }
            .modal-section {
                margin-bottom: 20px;
            }
            .modal-section h4 {
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 12px;
                color: var(--text-primary);
            }
            .recommendation-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .recommendation-tags span {
                padding: 6px 16px;
                background: var(--light-gray);
                border-radius: 15px;
                font-size: 14px;
            }
            .score-display {
                font-size: 32px;
                font-weight: 800;
                color: var(--neon-purple);
            }
            .preview-item {
                display: flex;
                align-items: center;
                justify-content: center;
                background: white;
            }
            .preview-item.empty {
                background: var(--light-gray);
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
