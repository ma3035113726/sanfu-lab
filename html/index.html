<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANFU LAB - AI潮流穿搭互动平台</title>
    <link rel="stylesheet" href="../css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">SANFU LAB</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="ai-outfit.html">AI穿搭</a></li>
                <li><a href="community.html">潮流社区</a></li>
                <li><a href="lab.html">穿搭实验室</a></li>
                <li><a href="stores.html">品牌故事</a></li>
                <li><a href="member.html">会员中心</a></li>
                <li><a href="closet.html">我的衣橱</a></li>
            </ul>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="搜索穿搭风格..." id="searchInput">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="user-avatar" onclick="location.href='login.html'">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <section class="banner">
        <div class="banner-bg"></div>
        <div class="banner-content">
            <h1 class="banner-title">搭出你的情绪风格</h1>
            <p class="banner-subtitle">AI驱动的个性化穿搭体验</p>
            <div class="banner-buttons">
                <a href="ai-outfit.html" class="banner-btn-primary">立即生成今日穿搭</a>
                <a href="lab.html" class="banner-btn-secondary">进入穿搭实验室</a>
            </div>
        </div>
        <div class="parallax-elements">
            <div class="floating-element element-1"></div>
            <div class="floating-element element-2"></div>
            <div class="floating-element element-3"></div>
        </div>
    </section>

    

    <script>
        const navbar = document.getElementById('navbar');
        const searchInput = document.getElementById('searchInput');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        searchInput.addEventListener('focus', () => {
            location.href = 'search.html';
        });

        document.addEventListener('DOMContentLoaded', () => {
            const revealElements = document.querySelectorAll('.scroll-reveal');
            
            const revealOnScroll = () => {
                revealElements.forEach(element => {
                    const elementTop = element.getBoundingClientRect().top;
                    const windowHeight = window.innerHeight;
                    
                    if (elementTop < windowHeight * 0.9) {
                        element.classList.add('visible');
                    }
                });
            };

            revealOnScroll();
            window.addEventListener('scroll', revealOnScroll);
        });
    </script>
</body>
</html>
