<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANFU LAB - 登录</title>
    <link rel="stylesheet" href="../css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <section class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">SANFU LAB</div>
                    <h1 class="login-title">欢迎回来</h1>
                    <p class="login-subtitle">登录你的账户，开启潮流之旅</p>
                </div>

                <form class="login-form">
                    <div class="form-group">
                        <label class="form-label">手机</label>
                        <input type="tel" class="form-input" placeholder="请输入手机号">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" placeholder="请输入密码">
                    </div>
                    <button type="submit" class="login-btn">登录</button>
                </form>

                <div class="login-divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">或</span>
                    <div class="divider-line"></div>
                </div>

                <div class="social-login">
                    <button class="social-btn">
                        <i class="fab fa-weixin"></i>
                        <span>微信</span>
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-qq"></i>
                        <span>QQ</span>
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-apple"></i>
                        <span>Apple</span>
                    </button>
                </div>

                <div class="login-footer">
                    <p>还没有账户？<a href="register.html">立即注册</a></p>
                    <p><a href="#">忘记密码</a></p>
                </div>
            </div>

            <div class="login-decor">
                <div class="decor-circle circle-1"></div>
                <div class="decor-circle circle-2"></div>
                <div class="decor-circle circle-3"></div>
            </div>
        </div>
    </section>

    <script>
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const welcomeModal = document.createElement('div');
            welcomeModal.className = 'welcome-modal';
            welcomeModal.innerHTML = `
                <div class="welcome-content">
                    <div class="welcome-icon">
                        <i class="fas fa-check"></i>
                    </div>
                    <h2>登录成功</h2>
                    <p>欢迎回到 SANFU LAB</p>
                    <div class="welcome-animation"></div>
                </div>
            `;
            document.body.appendChild(welcomeModal);

            setTimeout(() => {
                location.href = 'index.html';
            }, 2000);
        });

        const style = document.createElement('style');
        style.textContent = `
            .welcome-modal {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2000;
                animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .welcome-content {
                text-align: center;
                animation: slideUp 0.5s ease;
            }
            @keyframes slideUp {
                from { transform: translateY(30px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            .welcome-icon {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                background: linear-gradient(135deg, #A855F7, #F472B6);
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 20px;
                color: white;
                font-size: 32px;
                animation: pop 0.5s ease;
            }
            @keyframes pop {
                0% { transform: scale(0); }
                50% { transform: scale(1.2); }
                100% { transform: scale(1); }
            }
            .welcome-content h2 {
                font-size: 28px;
                font-weight: 700;
                color: white;
                margin-bottom: 8px;
            }
            .welcome-content p {
                color: rgba(255,255,255,0.7);
                font-size: 16px;
            }
            .welcome-animation {
                width: 200px;
                height: 3px;
                background: linear-gradient(90deg, transparent, #A855F7, transparent);
                margin: 20px auto 0;
                animation: scan 1s ease-in-out infinite;
            }
            @keyframes scan {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(100%); }
            }
            .login-decor {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                pointer-events: none;
            }
            .decor-circle {
                position: absolute;
                border-radius: 50%;
                opacity: 0.3;
            }
            .circle-1 {
                width: 300px;
                height: 300px;
                background: radial-gradient(circle, #A855F7, transparent);
                top: -100px;
                right: -100px;
                animation: float 6s ease-in-out infinite;
            }
            .circle-2 {
                width: 200px;
                height: 200px;
                background: radial-gradient(circle, #F472B6, transparent);
                bottom: -50px;
                left: -50px;
                animation: float 8s ease-in-out infinite reverse;
            }
            .circle-3 {
                width: 150px;
                height: 150px;
                background: radial-gradient(circle, #60A5FA, transparent);
                top: 50%;
                right: 20%;
                animation: float 4s ease-in-out infinite;
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
